  <li><b>新建一个活动</b><span>点「粘贴要求，自动生成」，把通知粘贴进去；或者直接选一种活动类型。</span></li>
  <li><b>按顶部的 1～7 一页页填</b><span>每页底部都有「下一步」按钮，照着点下去就行。不需要的页可以跳过。</span></li>
  <li><b>点右上角的「下载 Word」</b><span>拿到写好的策划案，发给老师或团队。</span></li>
</ol>`;

function helpHidden() { try { return localStorage.getItem('planner.helpHidden') === '1'; } catch { return false; } }
function hideHelp() { try { localStorage.setItem('planner.helpHidden', '1'); } catch { /* 存不了就只在这次隐藏 */ } }

function topBar(back) {
  return `<header class="top"><div class="brand">${back ? '<button class="btn ghost small" data-act="home">← 全部活动</button>' : ''}<h1>活动策划工具箱</h1></div><div class="row"><span class="save" id="save"></span><button class="btn small ghost" data-act="help">帮助</button></div></header>`;
}

function homeView() {
  const sample = plans.find((p) => p.sample);
  const list = plans.length ? `<div class="plans">${plans.map((p) => {
    const bs = budgetSum(p);
    return `<button class="plan-card" data-act="open" data-id="${p.id}">
      <div class="row"><span class="tag ${p.sample ? 'sample' : ''}">${p.sample ? '示例，点开看看' : esc(TYPES[p.type].label)}</span></div>
      <h3>${esc(p.name || '未命名活动')}</h3>
      <div class="meta">${esc(p.date || '日期待定')} · ${esc(p.location || '地点待定')}</div>
      <div class="meta">${p.items.length} 个${esc(TYPES[p.type].item)} · ${p.groups.length} 组 · 预算 ${money(bs.total)}</div>
    </button>`;
  }).join('')}</div>` : '<div class="empty">还没有活动，从下面选一种开始</div>';
  const help = helpHidden() ? '' : `<section class="panel welcome"><div class="panel-head"><h2>3 步做好一份活动策划</h2><button class="btn small ghost" data-act="help-hide">知道了，收起</button></div>
    ${HELP_STEPS}
    ${sample ? `<div class="row"><button class="btn" data-act="open" data-id="${sample.id}">先看看示例活动</button><span class="hint">示例可以随便点、随便改，不影响别的。</span></div>` : ''}
  </section>`;
  return `${topBar(false)}
  ${help}
  <section class="panel"><h2>新建活动</h2>
    <button class="new-card paste-card" data-act="req-open"><b>粘贴要求，自动生成</b><span>把通知或要求粘贴进来，也可以选 Word、文本文件。会自动识别类型、时间、地点、人数、预算、分组和项目。</span></button>
    <p class="hint">或者选一种类型，会自动带上常用的项目、流程、物资和分工，再按你们的情况改。</p>
    <div class="new-grid">${Object.entries(TYPES).map(([k, t]) => `<button class="new-card" data-act="new" data-type="${k}"><b>${esc(t.label)}</b><span>${esc(t.blurb)}</span></button>`).join('')}</div>
  </section>
  <section class="panel"><div class="panel-head"><h2>我的活动</h2><div class="row"><button class="btn small" data-act="backup">备份全部</button><label class="btn small">导入备份<input type="file" id="importFile" accept=".json,application/json" hidden></label></div></div>${list}</section>`;
}

function stepNav(i) {
  const prev = TABS[i - 1];
  const next = TABS[i + 1];
  return `<nav class="stepnav">
    ${prev ? `<button class="btn" data-act="tab" data-tab="${prev[0]}">← 上一步：${prev[1]}</button>` : '<span></span>'}
    ${next ? `<button class="btn primary" data-act="tab" data-tab="${next[0]}">下一步：${next[1]} →</button>` : '<button class="btn primary" data-act="docx">下载 Word 策划案</button>'}
  </nav>`;
}

function planView(p) {
  const T = TYPES[p.type];
  const tl = timeline(p);
  const end = tl.length ? tl[tl.length - 1].end : toMin(p.startTime);
  const i = TABS.findIndex(([k]) => k === tab);
  return `${topBar(true)}
  <section class="board">
    <div class="row"><span class="tag ${p.sample ? 'sample' : ''}">${p.sample ? '示例活动：可以随便点、随便改' : esc(T.label)}</span><span class="spacer"></span><button class="btn primary small" data-act="docx">下载 Word</button></div>
    ${p.sample ? '<p class="hint">要做自己的活动：点左上角「← 全部活动」，再点「新建活动」。</p>' : ''}
    <input class="title-input" id="f-name" data-f="name" value="${esc(p.name)}" aria-label="活动名称">
    <div class="facts"><span id="fact-date">${esc(p.date || '日期待定')}</span><span id="fact-time" class="mono">${esc(p.startTime)}—${hm(end)}</span><span id="fact-loc">${esc(p.location || '地点待定')}</span><span>${p.groups.length} 组</span></div>
    <nav class="tabs" role="tablist">${TABS.map(([k, l], n) => `<button class="tab" role="tab" aria-selected="${tab === k}" data-act="tab" data-tab="${k}"><span class="tabno">${n + 1}</span>${l}</button>`).join('')}</nav>
    <p class="intro"><b>第 ${i + 1} 步，共 ${TABS.length} 步</b>${TAB_INTRO[tab]}</p>
  </section>
  ${({ overview: overviewTab, flow: flowTab, groups: groupsTab, score: scoreTab, budget: budgetTab, tasks: tasksTab, doc: docTab })[tab](p)}
  ${stepNav(i)}`;
}

function field(label, f, value, type = 'text', extra = '') {
  return `<label class="f ${extra}"><span>${label}</span><input type="${type}" id="f-${f}" data-f="${f}" value="${esc(value)}"${type === 'number' ? ' inputmode="numeric" min="0"' : ''}></label>`;
}
function area(label, f, value) {
  return `<label class="f wide"><span>${label}</span><textarea id="f-${f}" data-f="${f}">${esc(value)}</textarea></label>`;
}

function overviewTab(p) {
  return `<section class="panel"><div id="stats">${statsHtml(p)}</div></section>
  <section class="panel"><h2>基本信息</h2>
    <div class="form">
      ${field('日期', 'date', p.date, 'date')}
      ${field('开始时间', 'startTime', p.startTime, 'time')}
      ${field('地点', 'location', p.location)}
      ${field('主办单位', 'organizer', p.organizer)}
      ${field('参与对象', 'audience', p.audience)}
      ${field('预计人数', 'headcount', p.headcount, 'number')}
      ${field('活动主题 / 口号', 'theme', p.theme, 'text', 'wide')}
    </div>
  </section>
  ${p.requirements ? `<section class="panel"><details><summary><h2 style="display:inline">原始要求</h2></summary><div style="margin-top:12px">${area('创建时粘贴的要求，留着方便对照', 'requirements', p.requirements)}</div></details></section>` : ''}
  <section class="panel"><div class="row"><button class="btn small" data-act="dup">复制这个活动</button><span class="spacer"></span><button class="btn small danger" data-act="del">删除这个活动</button></div></section>`;
}

function statsHtml(p) {
  const bs = budgetSum(p);
  const limit = num(p.budgetLimit);
  const done = p.tasks.filter((t) => t.done).length;
  const tl = timeline(p);
  const minutes = tl.length ? tl[tl.length - 1].end - tl[0].start : 0;
  const pct = limit ? Math.min(100, (bs.total / limit) * 100) : 0;
  const days = p.date ? Math.ceil((new Date(p.date + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000) : null;
  return `<div class="stats">
    <div class="stat"><span>距离活动</span><b>${days == null ? '—' : days >= 0 ? days + ' 天' : '已结束'}</b><span>${esc(p.date || '先在下面填日期')}</span></div>
    <div class="stat"><span>活动时长</span><b>${Math.floor(minutes / 60)}h${String(minutes % 60).padStart(2, '0')}</b><span>${p.schedule.length} 个环节</span></div>
    <div class="stat"><span>预算</span><b>${money(bs.total)}</b><div class="meter ${limit && bs.total > limit ? 'over' : ''}"><i style="width:${pct}%"></i></div><span>${limit ? '上限 ' + money(limit) : '未设上限'}</span></div>
    <div class="stat"><span>分工进度</span><b>${done}/${p.tasks.length}</b><div class="meter"><i style="width:${p.tasks.length ? (done / p.tasks.length) * 100 : 0}%"></i></div><span>${p.tasks.length - done} 项未完成</span></div>
  </div>`;
}

function itemRow(p, it) {
  const cols = TYPES[p.type].cols;
  const cell = (k) => {
    if (k === 'cat') return `<select id="i-${it.id}-cat" data-l="items" data-id="${it.id}" data-k="cat" aria-label="类型">${GALA_CATS.map((c) => `<option ${it.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
    const ph = k === 'who' ? WHO_LABEL[p.type] : COL_LABEL[k];
    const wide = k === 'name' || k === 'note' ? ' full' : '';
    return `<input class="${wide}" type="${k === 'minutes' ? 'number' : 'text'}" id="i-${it.id}-${k}" data-l="items" data-id="${it.id}" data-k="${k}" value="${esc(it[k])}" placeholder="${esc(ph)}" aria-label="${esc(ph)}">`;
  };
  return `<div class="item cols-${p.type}">${cols.map(cell).join('')}<button class="x" data-act="rm" data-l="items" data-id="${it.id}" aria-label="删除">×</button></div>`;
}

function colhead(cls, labels) {
  return `<div class="colhead ${cls}">${labels.map((l) => `<span>${l}</span>`).join('')}</div>`;
}

function flowTab(p) {
  const T = TYPES[p.type];
  const labels = T.cols.map((k) => (k === 'who' ? WHO_LABEL[p.type] : COL_LABEL[k] + (k === 'minutes' ? '' : ''))).concat(['']);
  return `<section class="panel">
    <div class="panel-head"><h2>${T.item}</h2><button class="btn small" data-act="add" data-l="items">＋ 添加${T.item}</button></div>
    ${p.type === 'sports' ? '<p class="hint">各项目同时在不同场地进行，每组轮流参加。有几个组、几个项目，就自动排几轮。</p>' : ''}
    ${p.type === 'gala' ? '<p class="hint">自动排流程时会尽量避免同类节目连在一起，并按节目数量插入中场环节。</p>' : ''}
    ${colhead('cols-' + p.type, labels)}
    <div class="list">${p.items.map((it) => itemRow(p, it)).join('') || '<div class="empty">还没有内容</div>'}</div>
    <div class="row"><button class="btn primary" data-act="gen">按上面的${T.item}自动排流程</button><span class="hint">会覆盖下面的流程表</span></div>
  </section>
  <div id="rotation">${rotationHtml(p)}</div>
  <section class="panel">
    <div class="panel-head"><h2>流程时间表</h2><div class="row">
      <label class="f" style="grid-auto-flow:column;align-items:center;gap:8px"><span>开始</span><input type="time" id="f-startTime2" data-f="startTime" value="${esc(p.startTime)}" style="width:auto"></label>
      <button class="btn small" data-act="add" data-l="schedule">＋ 环节</button><button class="btn small" data-act="csv" data-kind="schedule">导出表格</button></div></div>
    ${colhead('cols-sched', ['时间', '环节', '分钟', '地点', '负责人', ''])}
    <div class="list">${p.schedule.map((s, i) => schedRow(p, s, i)).join('') || '<div class="empty">点上面的按钮自动生成，或手动添加</div>'}</div>
    <p class="hint" id="flow-end">${flowEndText(p)}</p>
  </section>`;
}

function flowEndText(p) {
  const tl = timeline(p);
  if (!tl.length) return '';
  const total = tl[tl.length - 1].end - tl[0].start;
  return `共 ${Math.floor(total / 60)} 小时 ${total % 60} 分钟，预计 ${hm(tl[tl.length - 1].end)} 结束。`;
}

function schedRow(p, s, i) {
  const t = timeline(p)[i];
  return `<div class="item cols-sched">
    <span class="time" id="t-${s.id}">${hm(t.start)}—${hm(t.end)}</span>
    <input class="full" id="s-${s.id}-title" data-l="schedule" data-id="${s.id}" data-k="title" value="${esc(s.title)}" placeholder="环节" aria-label="环节">
    <input type="number" id="s-${s.id}-minutes" data-l="schedule" data-id="${s.id}" data-k="minutes" value="${esc(s.minutes)}" aria-label="分钟" inputmode="numeric" min="0">
    <input id="s-${s.id}-place" data-l="schedule" data-id="${s.id}" data-k="place" value="${esc(s.place)}" placeholder="地点" aria-label="地点">
    <input id="s-${s.id}-owner" data-l="schedule" data-id="${s.id}" data-k="owner" value="${esc(s.owner)}" placeholder="负责人" aria-label="负责人">
    <button class="x" data-act="rm" data-l="schedule" data-id="${s.id}" aria-label="删除">×</button>
    ${s.note ? `<input class="full" style="grid-column:1/-1" id="s-${s.id}-note" data-l="schedule" data-id="${s.id}" data-k="note" value="${esc(s.note)}" aria-label="说明">` : ''}
  </div>`;
}

function rotationHtml(p) {
  const rot = rotation(p);
  if (!rot) return '';
  return `<section class="panel"><h2>轮转表</h2><p class="hint">每一轮各组去哪个项目。组和项目改了以后，点「自动排流程」更新时间表。</p>
    <div class="table-wrap"><table><thead><tr><th>轮次</th>${p.groups.map((g) => `<th>${esc(g.name)}</th>`).join('')}</tr></thead>
    <tbody>${rot.map((r, i) => `<tr><td class="mono">第 ${i + 1} 轮</td>${r.map((c) => `<td class="${c ? '' : 'rest'}">${esc(c || '休息')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
}

function groupsTab(p) {
  const names = parseRoster(p.roster);
  const per = p.groupCount ? Math.ceil((names.length || num(p.headcount)) / num(p.groupCount)) : 0;
  return `<section class="panel"><h2>分组</h2>
    <div class="form">
      ${field('分几组', 'groupCount', p.groupCount, 'number')}
      <label class="f"><span>组名风格</span><select id="f-groupTheme" data-f="groupTheme">${Object.entries(GROUP_THEMES).map(([k, t]) => `<option value="${k}" ${p.groupTheme === k ? 'selected' : ''}>${t.label}</option>`).join('')}</select></label>
      <label class="f wide"><span>名单（可直接从 Excel 或微信粘贴，用空格、逗号、换行分开都行）</span><textarea id="f-roster" data-f="roster" placeholder="不填名单也能分组，只是每组没有成员">${esc(p.roster)}</textarea></label>
    </div>
    <div class="row"><button class="btn primary" data-act="regroup">随机分组</button><span class="hint" id="roster-count">名单 ${names.length} 人${per ? `，每组约 ${per} 人` : ''}</span><span class="spacer"></span><button class="btn small" data-act="csv" data-kind="groups" ${p.groups.length ? '' : 'disabled'}>导出表格</button></div>
  </section>
  <section class="panel"><h2>分组结果</h2>
    ${p.groups.length ? `<div class="groups">${p.groups.map((g) => `<div class="group">
      <input id="g-${g.id}-name" data-l="groups" data-id="${g.id}" data-k="name" value="${esc(g.name)}" aria-label="组名">
      <input id="g-${g.id}-leader" data-l="groups" data-id="${g.id}" data-k="leader" value="${esc(g.leader)}" placeholder="组长" aria-label="组长">
      <div class="members">${g.members.length ? `${g.members.length} 人：${g.members.map(esc).join('、')}` : '暂无成员'}</div>
    </div>`).join('')}</div>` : '<div class="empty">填好组数，点「随机分组」</div>'}
  </section>`;
}

function scoreTab(p) {
  const modes = [['rank', '按名次积分'], ['judge', '评委打分'], ['off', '不计分']];
  const head = `<section class="panel"><div class="panel-head"><h2>计分方式</h2><div class="row">${modes.map(([k, l]) => `<button class="chip ${p.scoring === k ? 'on' : ''}" data-act="mode" data-mode="${k}">${l}</button>`).join('')}</div></div>
    <p class="hint">${p.scoring === 'rank' ? '适合运动会、团建：各组每个项目排名次，按名次换算积分。' : p.scoring === 'judge' ? '适合晚会、比赛：评委给每个节目打分，5 位及以上评委时去掉最高分和最低分。' : '这个活动不需要计分。'}</p></section>`;
  if (p.scoring === 'off') return head;
  if (p.scoring === 'judge') {
    const items = p.items.filter((i) => i.name.trim());
    return head + `<section class="panel"><div class="panel-head"><h2>评委打分</h2><div class="row">${field('评委人数', 'judges', p.judges, 'number')}</div></div>
      ${items.length ? `<div class="table-wrap"><table><thead><tr><th>节目</th>${Array.from({ length: p.judges }, (_, j) => `<th class="num">评委 ${j + 1}</th>`).join('')}</tr></thead><tbody>
      ${items.map((it) => `<tr><td>${esc(it.name)}</td>${Array.from({ length: p.judges }, (_, j) => `<td><input type="number" step="0.1" min="0" max="10" inputmode="decimal" id="j-${it.id}-${j}" data-j="${it.id}" data-n="${j}" value="${esc(p.jscores?.[it.id]?.[j] ?? '')}" aria-label="${esc(it.name)} 评委 ${j + 1}"></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">先在「流程」里添加节目</div>'}
    </section>
    <section class="panel"><div class="panel-head"><h2>实时排名</h2><div class="row"><button class="btn small" data-act="big">大屏展示</button><button class="btn small" data-act="csv" data-kind="scores">导出成绩</button></div></div><div id="ranking">${rankingHtml(p)}</div></section>`;
  }
  const items = p.items.filter((i) => i.name.trim());
  if (!p.groups.length) return head + '<section class="panel"><div class="empty">先在「分组」里分好组</div></section>';
  return head + `<section class="panel"><h2>名次积分</h2>
    <div class="row">${p.rankPoints.map((v, i) => `<label class="f" style="width:72px"><span>第 ${i + 1} 名</span><input type="number" min="0" id="rp-${i}" data-rp="${i}" value="${esc(v)}" inputmode="numeric"></label>`).join('')}</div>
  </section>
  <section class="panel"><h2>录入名次</h2><p class="hint">比赛一结束就选名次，下面的排名马上更新。</p>
    <div class="table-wrap"><table><thead><tr><th>项目</th>${p.groups.map((g) => `<th>${esc(g.name)}</th>`).join('')}</tr></thead><tbody>
    ${items.map((it) => `<tr><td>${esc(it.name)}</td>${p.groups.map((g) => `<td><select id="r-${it.id}-${g.id}" data-r="${it.id}" data-g="${g.id}" aria-label="${esc(it.name)} ${esc(g.name)}"><option value="">—</option>${p.groups.map((_, k) => `<option value="${k + 1}" ${p.results?.[it.id]?.[g.id] === k + 1 ? 'selected' : ''}>第${k + 1}名</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}
    <tr><td>额外加分</td>${p.groups.map((g) => `<td><input type="number" id="b-${g.id}" data-bonus="${g.id}" value="${esc(p.bonus?.[g.id] ?? '')}" placeholder="0" aria-label="${esc(g.name)} 加分"></td>`).join('')}</tr>
    </tbody></table></div>
  </section>
  <section class="panel"><div class="panel-head"><h2>实时排名</h2><div class="row"><button class="btn small" data-act="big">大屏展示</button><button class="btn small" data-act="csv" data-kind="scores">导出成绩</button></div></div><div id="ranking">${rankingHtml(p)}</div></section>`;
}

function rankingHtml(p) {
  if (p.scoring === 'judge') {
    const rows = judged(p);
    if (!rows.some((r) => r.avg != null)) return '<div class="empty">还没有分数</div>';
    const max = 10;
    return `<div class="rank">${rows.map((r) => `<div class="rank-row"><span class="place">${r.place || '—'}</span><span class="name">${esc(r.name)}</span><div class="bar"><i style="width:${r.avg == null ? 0 : (r.avg / max) * 100}%"></i></div><b>${r.avg == null ? '—' : r.avg.toFixed(2)}</b></div>`).join('')}</div>`;
  }
  const rows = standings(p);
  const max = Math.max(1, ...rows.map((r) => r.total));
  return `<div class="rank">${rows.map((r) => `<div class="rank-row"><span class="place">${r.place}</span><span class="name">${esc(r.name)}</span><div class="bar"><i style="width:${(Math.max(0, r.total) / max) * 100}%"></i></div><b>${r.total}</b></div>`).join('')}</div>`;
}

function budgetTab(p) {
  return `<section class="panel"><div id="budget-sum">${budgetSumHtml(p)}</div></section>
  <section class="panel"><div class="panel-head"><h2>物资清单</h2><div class="row">${field('预算上限（元）', 'budgetLimit', p.budgetLimit, 'number')}</div></div>
    <div class="row"><button class="btn small" data-act="add" data-l="budget">＋ 添加物品</button><button class="btn small" data-act="csv" data-kind="budget">导出表格</button></div>
    ${colhead('cols-budget', ['物品', '类别', '数量', '单价', '负责人', '状态', ''])}
    <div class="list">${p.budget.map((b) => `<div class="item cols-budget ${b.bought ? 'done' : ''}">
      <input class="full" id="bg-${b.id}-name" data-l="budget" data-id="${b.id}" data-k="name" value="${esc(b.name)}" placeholder="物品" aria-label="物品">
      <select id="bg-${b.id}-cat" data-l="budget" data-id="${b.id}" data-k="cat" aria-label="类别">${BUDGET_CATS.map((c) => `<option ${b.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <input type="number" min="0" id="bg-${b.id}-qty" data-l="budget" data-id="${b.id}" data-k="qty" value="${esc(b.qty)}" aria-label="数量" inputmode="numeric">
      <input type="number" min="0" step="0.01" id="bg-${b.id}-price" data-l="budget" data-id="${b.id}" data-k="price" value="${esc(b.price)}" aria-label="单价" inputmode="decimal">
      <input id="bg-${b.id}-owner" data-l="budget" data-id="${b.id}" data-k="owner" value="${esc(b.owner)}" placeholder="负责人" aria-label="负责人">
      <button class="chip ${b.bought ? 'on' : ''}" data-act="bought" data-id="${b.id}">${b.bought ? '已买' : '待买'}</button>
      <button class="x" data-act="rm" data-l="budget" data-id="${b.id}" aria-label="删除">×</button>
    </div>`).join('') || '<div class="empty">还没有物品</div>'}</div>
  </section>`;
}

function budgetSumHtml(p) {
  const { total, bought, byCat } = budgetSum(p);
  const limit = num(p.budgetLimit);
  const cats = Object.entries(byCat).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const maxCat = Math.max(1, ...cats.map(([, v]) => v));
  return `<div class="stats">
    <div class="stat"><span>预计花费</span><b>${money(total)}</b><span>${limit ? (total > limit ? `<span style="color:var(--bad)">超出 ${money(total - limit)}</span>` : `还剩 ${money(limit - total)}`) : '未设上限'}</span></div>
    <div class="stat"><span>已经买了</span><b>${money(bought)}</b><span>还要买 ${money(total - bought)}</span></div>
  </div>
  ${cats.length ? `<div class="rank">${cats.map(([c, v]) => `<div class="rank-row" style="grid-template-columns:72px 1fr 90px"><span class="name">${esc(c)}</span><div class="bar"><i style="width:${(v / maxCat) * 100}%"></i></div><b>${money(v)}</b></div>`).join('')}</div>` : ''}`;
}

function tasksTab(p) {
  const today = new Date().toISOString().slice(0, 10);
  const sorted = [...p.tasks].sort((a, b) => (a.done - b.done) || String(a.due || '9').localeCompare(String(b.due || '9')));
  return `<section class="panel"><div class="panel-head"><h2>分工</h2><button class="btn small" data-act="add" data-l="tasks">＋ 添加任务</button></div>
    <p class="hint">${p.date ? '截止日期按活动日期自动倒推，也可以手动改。' : '在「概览」填上活动日期，截止日期会自动倒推。'}</p>
    ${colhead('cols-task', ['', '任务', '负责人', '截止', ''])}
    <div class="list">${sorted.map((t) => `<div class="item cols-task ${t.done ? 'done' : ''}">
      <input type="checkbox" id="tk-${t.id}-done" data-tdone="${t.id}" ${t.done ? 'checked' : ''} aria-label="完成">
      <input class="full" id="tk-${t.id}-task" data-l="tasks" data-id="${t.id}" data-k="task" value="${esc(t.task)}" placeholder="任务" aria-label="任务">
      <input id="tk-${t.id}-owner" data-l="tasks" data-id="${t.id}" data-k="owner" value="${esc(t.owner)}" placeholder="负责人" aria-label="负责人">
      <div><input type="date" id="tk-${t.id}-due" data-l="tasks" data-id="${t.id}" data-k="due" value="${esc(t.due)}" aria-label="截止日期">${!t.done && t.due && t.due < today ? '<div class="late">已过期</div>' : ''}</div>
      <button class="x" data-act="rm" data-l="tasks" data-id="${t.id}" aria-label="删除">×</button>
    </div>`).join('') || '<div class="empty">还没有任务</div>'}</div>
  </section>`;
}

function autoSummary(p, key) {
  const tl = timeline(p);
  const end = tl.length ? tl[tl.length - 1].end : toMin(p.startTime);
  const bs = budgetSum(p);
  switch (key) {
    case 'basic': return `${p.date || '日期未填'} ${p.startTime}—${hm(end)} · ${p.location || '地点未填'} · ${p.audience || '对象未填'} · ${num(p.headcount) || '?'} 人`;
    case 'flow': return p.schedule.length ? `共 ${p.schedule.length} 个环节，${hm(tl[0].start)}—${hm(end)}` : '还没有排流程';
    case 'groups': return p.groups.length ? `${p.groups.length} 个组，共 ${p.groups.reduce((s, g) => s + g.members.length, 0)} 人` : '没有分组，这部分不会写进策划案';
    case 'scoring': return p.scoring === 'rank' ? '按名次积分' : p.scoring === 'judge' ? `${p.judges} 位评委打分` : '不计分，这部分不会写进策划案';
    case 'tasks': return p.tasks.length ? `${p.tasks.length} 项任务，${p.tasks.filter((t) => !String(t.owner || '').trim()).length} 项还没有负责人` : '还没有任务';
    case 'budget': return p.budget.length ? `${p.budget.length} 项，合计 ${money(bs.total)}${num(p.budgetLimit) ? `，上限 ${money(num(p.budgetLimit))}` : ''}` : '还没有预算';
    default: return '';
  }
}

function checksHtml(p) {
  const checks = docChecks(p);
  const ok = checks.filter((c) => c[1]).length;
  return `<div class="panel-head"><h3>自查清单</h3><span class="tag">${ok} / ${checks.length}</span></div>
    <ul class="checks">${checks.map(([t, pass]) => `<li class="${pass ? 'pass' : ''}">${pass ? '✓' : '○'} ${esc(t)}</li>`).join('')}</ul>`;
}

const TAB_NAME = Object.fromEntries([['overview', '概览'], ['flow', '流程'], ['groups', '分组'], ['score', '计分'], ['budget', '预算物资'], ['tasks', '分工']]);

function docTab(p) {
  const secs = DOC_SECTIONS.map((s, i) => {
    const on = sectionOn(p, s.key);
    const how = `<details class="how"><summary>怎么写</summary><p>${esc(s.guide)}</p><ul>${s.tips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul></details>`;
    let body;
    if (s.kind === 'auto') {
      body = `<div class="auto"><span>自动生成：<b id="auto-${s.key}">${esc(autoSummary(p, s.key))}</b></span><button class="btn small" data-act="tab" data-tab="${s.tab}">去「${TAB_NAME[s.tab]}」修改</button></div>`;
    } else if (s.kind === 'line') {
      body = `<div class="row"><input type="text" id="d-${s.key}" data-f="${s.key}" value="${esc(p[s.key])}" style="flex:1;min-width:0" aria-label="${s.title}"><button class="btn small" data-act="sample" data-key="${s.key}">填入参考写法</button></div>`;
    } else {
      body = `<textarea id="d-${s.key}" data-f="${s.key}" aria-label="${s.title}" placeholder="还没写。点下面的「填入参考写法」，再按你们的情况改。">${esc(p[s.key])}</textarea><div class="row"><button class="btn small" data-act="sample" data-key="${s.key}">填入参考写法</button></div>`;
    }
    return `<section class="panel doc-sec ${on ? '' : 'off'}" id="sec-${s.key}">
      <div class="panel-head"><h3><span class="secno">${i + 1}</span>${s.title}</h3><label class="inc"><input type="checkbox" id="on-${s.key}" data-docon="${s.key}" ${on ? 'checked' : ''}> 写进策划案</label></div>
      ${how}${body}
    </section>`;
  }).join('');
  return `<section class="panel"><div class="panel-head"><h2>写策划案</h2><button class="btn primary" data-act="docx">下载 Word</button></div>
    <p class="hint">按顺序把每一部分写好。每部分点「怎么写」看要点，点「填入参考写法」可以先填一段范文再改。流程、分工、预算等会从其他页自动生成。</p>
    <div id="doc-checks">${checksHtml(p)}</div>
  </section>
  ${secs}
  <section class="panel"><div class="panel-head"><h2>预览</h2><div class="row"><button class="btn primary" data-act="docx">下载 Word</button><button class="btn" data-act="copydoc">复制全文</button></div></div>
    <article class="doc" id="doc-preview">${proposalHtml(proposal(p))}</article>
  </section>`;
}

/* 输入时只刷新算出来的部分，不重画输入框，打字不会被打断 */
let deriveTimer = null;
function deriveSoon() { clearTimeout(deriveTimer); deriveTimer = setTimeout(derive, 120); }
function derive() {
  const p = cur();
  if (!p) return;
  const tl = timeline(p);
  const end = tl.length ? tl[tl.length - 1].end : toMin(p.startTime);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const html = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };
  set('fact-date', p.date || '日期待定');
  set('fact-time', `${p.startTime}—${hm(end)}`);
  set('fact-loc', p.location || '地点待定');
  html('stats', statsHtml(p));
  p.schedule.forEach((s, i) => set('t-' + s.id, `${hm(tl[i].start)}—${hm(tl[i].end)}`));
  set('flow-end', flowEndText(p));
  html('rotation', rotationHtml(p));
  html('ranking', rankingHtml(p));
  html('budget-sum', budgetSumHtml(p));
  html('doc-preview', proposalHtml(proposal(p)));
  html('doc-checks', checksHtml(p));
  DOC_SECTIONS.filter((s) => s.kind === 'auto').forEach((s) => set('auto-' + s.key, autoSummary(p, s.key)));
  const names = parseRoster(p.roster);
  const per = p.groupCount ? Math.ceil((names.length || num(p.headcount)) / num(p.groupCount)) : 0;
  set('roster-count', `名单 ${names.length} 人${per ? `，每组约 ${per} 人` : ''}`);
}

const NUM_FIELDS = new Set(['headcount', 'budgetLimit', 'groupCount', 'judges', 'minutes', 'qty', 'price']);

document.addEventListener('input', (e) => {
  const el = e.target;
  const p = cur();
  if (!p) return;
  const val = el.value;
  if (el.dataset.f) {
    const f = el.dataset.f;
    p[f] = NUM_FIELDS.has(f) ? num(val) : val;
    if (f === 'judges') p.judges = Math.max(1, Math.min(15, Math.round(num(val)) || 1));
    if (f === 'date') recalcDue(p);
  } else if (el.dataset.l) {
    const row = p[el.dataset.l].find((r) => r.id === el.dataset.id);
    if (row) row[el.dataset.k] = NUM_FIELDS.has(el.dataset.k) ? num(val) : val;
  } else if (el.dataset.r) {
    p.results[el.dataset.r] = p.results[el.dataset.r] || {};
    if (val) p.results[el.dataset.r][el.dataset.g] = +val; else delete p.results[el.dataset.r][el.dataset.g];
  } else if (el.dataset.bonus) {
    p.bonus[el.dataset.bonus] = val === '' ? '' : num(val);
  } else if (el.dataset.rp) {
    p.rankPoints[+el.dataset.rp] = num(val);
  } else if (el.dataset.j) {
    const arr = (p.jscores[el.dataset.j] = p.jscores[el.dataset.j] || []);
    arr[+el.dataset.n] = val === '' ? '' : Math.max(0, Math.min(10, num(val)));
  } else if (el.dataset.docon) {
    p.docOff = p.docOff || {};
    if (el.checked) delete p.docOff[el.dataset.docon]; else p.docOff[el.dataset.docon] = true;
    el.closest('.doc-sec')?.classList.toggle('off', !el.checked);
  } else if (el.dataset.tdone) {
    const t = p.tasks.find((x) => x.id === el.dataset.tdone);
    if (t) t.done = el.checked;
    touch(p);
    render();
    return;
  } else return;
  touch(p);
  deriveSoon();
});

/* 改了会影响表格结构的字段，离开输入框后再整体重画 */
document.addEventListener('change', (e) => {
  const f = e.target.dataset.f;
  if (f === 'judges' || f === 'date' || (e.target.dataset.l === 'items' && e.target.dataset.k === 'name') || (e.target.dataset.l === 'groups' && e.target.dataset.k === 'name')) {
    if (tab === 'score' || tab === 'tasks' || tab === 'flow' || tab === 'groups') setTimeout(render, 0);
  }
  if (e.target.id === 'importFile') importBackup(e.target.files[0]);
  if (e.target.id === 'reqFile' && e.target.files[0]) {
    readRequirementFile(e.target.files[0])
      .then((t) => { $('#reqText').value = t.trim(); showParsed(); })
      .catch((err) => toast(err.message || '这个文件读不了'));
  }
});

let lastParsed = null;
const REQ_EXAMPLE = '例如：\n活动名称：星火杯迎新晚会\n时间：2026年12月20日晚上7点\n地点：学术报告厅\n预计 400 人参加，预算 5000 元，5 位评委打分\n节目：\n1. 开场舞（舞蹈队）5分钟\n2. 相声《宿舍那些事》（曲艺社）8分钟';

function openRequirements() {
  lastParsed = null;
  modal(`<h3>粘贴活动要求</h3>
    <p class="hint">把老师或团队发的通知、要求粘贴进来，或者选一个 Word（.docx）、文本文件。全部在本机识别，不会上传。</p>
    <textarea id="reqText" placeholder="${esc(REQ_EXAMPLE)}"></textarea>
    <div class="row"><label class="btn small">选择文件<input type="file" id="reqFile" accept=".docx,.txt,.md,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden></label><span class="spacer"></span><button class="btn" data-act="req-close">取消</button><button class="btn primary" data-act="req-parse">识别</button></div>
    <div id="reqResult"></div>`);
  setTimeout(() => $('#reqText')?.focus(), 50);
}

function showParsed() {
  const text = $('#reqText')?.value || '';
  if (!text.trim()) { toast('先粘贴要求，或者选一个文件'); return; }
  lastParsed = parseRequirements(text);
  const f = lastParsed.fields;
  const row = (label, v) => `<dt>${label}</dt><dd>${v == null || v === '' ? '<span class="miss">没找到，创建后可以手动填</span>' : esc(v)}</dd>`;
  const T = TYPES[lastParsed.type];
  $('#reqResult').innerHTML = `<h3>识别结果</h3><dl class="found">
    ${row('活动类型', T.label)}${row('名称', f.name)}${row('日期', f.date)}${row('开始时间', f.startTime)}${row('地点', f.location)}
    ${row('人数', f.headcount)}${row('预算', f.budgetLimit != null ? money(f.budgetLimit) : '')}${f.groupCount ? row('分组', f.groupCount + ' 组') : ''}
    ${f.judges ? row('评委', f.judges + ' 位') : ''}${f.organizer ? row('主办', f.organizer) : ''}${f.audience ? row('对象', f.audience) : ''}${f.theme ? row('主题', f.theme) : ''}
    ${row(T.item, lastParsed.items.length ? lastParsed.items.map((i) => i.name).join('、') : '')}
  </dl>
  <p class="hint">${lastParsed.items.length ? '' : `没找到${T.item}，会先用模板里的${T.item}，创建后再改。`}类型不对的话，在要求里写清楚，比如「趣味运动会」「晚会」「讲座」「团建」。</p>
  <div class="row"><span class="spacer"></span><button class="btn primary" data-act="req-create">创建活动</button></div>`;
}

/* 安卓 App 的返回键：先关弹窗、大屏，再回到活动列表 */
window.appBack = () => {
  if (!$('#modal').hidden) { closeModal(); return true; }
  if (!$('#big').hidden) { $('#bigClose')?.click(); return true; }
  if (curId) { curId = null; render(); return true; }
  return false;
};

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  const p = cur();
  if (act === 'home') { curId = null; render(); scrollTo(0, 0); return; }
  if (act === 'open') { curId = b.dataset.id; tab = 'overview'; render(); scrollTo(0, 0); return; }
  if (act === 'new') {
    const np = makePlan(b.dataset.type);
    plans.unshift(np); curId = np.id; tab = 'overview'; touch(np); render(); scrollTo(0, 0); return;
  }
  if (act === 'help') {
    const box = modal(`<h2>怎么用</h2>${HELP_STEPS}<p class="hint">活动当天：在「4 计分」录成绩，点「大屏展示」投到屏幕上。<br>资料只存在这台设备里，换手机前点首页的「备份全部」。</p><div class="row"><span class="spacer"></span><button class="btn primary" data-act="req-close">知道了</button></div>`);
    return;
  }
  if (act === 'help-hide') { hideHelp(); render(); return; }
  if (act === 'req-open') { openRequirements(); return; }
  if (act === 'req-close') { closeModal(); return; }
  if (act === 'req-parse') { showParsed(); return; }
  if (act === 'req-create') {
    if (!lastParsed) return;
    const np = planFromRequirements(lastParsed);
    closeModal();
    plans.unshift(np); curId = np.id; tab = 'overview'; touch(np); render(); scrollTo(0, 0);
    toast('活动已生成，检查一下各页内容');
    return;
  }
  if (act === 'backup') {
    const data = JSON.stringify({ app: 'planner', version: 1, plans: plans.filter((x) => !x.sample) }, null, 2);
    offerFile(`活动策划备份-${new Date().toISOString().slice(0, 10)}.json`, data, data);
    return;
  }
  if (!p) return;
  if (act === 'tab') { tab = b.dataset.tab; render(); if (b.closest('.stepnav, .auto')) scrollTo(0, 0); return; }
  if (act === 'del') {
    if (await confirmBox(`删除「${p.name}」？删除后不能恢复。`, '删除')) { await removePlan(p.id); curId = null; render(); toast('已删除'); }
    return;
  }
  if (act === 'dup') {
    const np = clone(p); np.id = newId(); np.name = p.name.replace('（示例）', '') + '（副本）'; delete np.sample;
    plans.unshift(np); curId = np.id; touch(np); render(); toast('已复制'); return;
  }
  if (act === 'add') {
    const l = b.dataset.l;
    if (l === 'items') p.items.push(itemFrom(p.type, p.type === 'gala' ? ['', '', '歌舞', 5] : p.type === 'lecture' ? ['', '', 10] : ['', 15, '', '']));
    if (l === 'schedule') p.schedule.push({ id: newId(), title: '', minutes: 10, place: '', owner: '', note: '' });
    if (l === 'budget') p.budget.push({ id: newId(), name: '', cat: '其他', qty: 1, price: 0, owner: '', bought: false });
    if (l === 'tasks') p.tasks.push({ id: newId(), task: '', owner: '', before: '', due: '', done: false });
    touch(p); render();
    const last = p[l][p[l].length - 1];
    document.querySelector(`[data-id="${last.id}"][data-k]`)?.focus();
    return;
  }
  if (act === 'rm') {
    p[b.dataset.l] = p[b.dataset.l].filter((r) => r.id !== b.dataset.id);
    touch(p); render(); return;
  }
  if (act === 'gen') {
    const go = !p.schedule.length || await confirmBox('重新排流程会覆盖现在的流程表，确定吗？', '重新排');
    if (go) { p.schedule = genSchedule(p); touch(p); render(); toast('流程已排好'); }
    return;
  }
  if (act === 'regroup') {
    const go = !p.groups.some((g) => g.members.length) || await confirmBox('重新分组会打乱现在的分组，确定吗？', '重新分组');
    if (!go) return;
    applyGroups(p, false); touch(p); render(); toast(`已分成 ${p.groups.length} 组`); return;
  }
  if (act === 'sample') {
    const key = b.dataset.key;
    if (String(p[key] || '').trim() && !(await confirmBox('这一部分已经有内容了，用参考写法替换吗？', '替换'))) return;
    p[key] = sampleText(p, key);
    const box = document.getElementById('d-' + key);
    if (box) box.value = p[key];
    touch(p); derive(); toast('已填入，记得按你们的情况改');
    return;
  }
  if (act === 'mode') { p.scoring = b.dataset.mode; touch(p); render(); return; }
  if (act === 'bought') { const r = p.budget.find((x) => x.id === b.dataset.id); r.bought = !r.bought; touch(p); render(); return; }
  if (act === 'csv') { exportCsv(b.dataset.kind); return; }
  if (act === 'big') { openBig(); return; }
  if (act === 'copydoc') { copyText(proposalText(proposal(p))); return; }
  if (act === 'docx') {
    try { const blob = await proposalDocx(proposal(p)); offerFile(`${p.name}策划案.docx`, blob); }
    catch { toast('Word 生成失败，可以先用「复制全文」'); }
  }
});

function openBig() {
  const p = cur();
  const big = $('#big');
  const draw = () => {
    big.innerHTML = `<div class="row"><h2>${esc(p.name)} · 实时排名</h2><span class="spacer"></span><button class="btn" id="bigClose">退出大屏</button></div><div>${rankingHtml(p)}</div>`;
    $('#bigClose').onclick = () => { big.hidden = true; clearInterval(openBig.timer); document.fullscreenElement && document.exitFullscreen?.().catch(() => {}); };
  };
  draw();
  big.hidden = false;
  big.requestFullscreen?.().catch(() => {});
  clearInterval(openBig.timer);
  openBig.timer = setInterval(() => { if (!big.hidden) big.lastElementChild.innerHTML = rankingHtml(p); }, 2000);
}

function importBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      const list = (data.plans || []).filter((x) => x && x.id && TYPES[x.type]);
      if (!list.length) throw new Error();
      list.forEach((x) => { const i = plans.findIndex((y) => y.id === x.id); if (i >= 0) plans[i] = x; else plans.push(x); touch(x); });
      plans = plans.filter((x) => !x.sample);
      render();
      toast(`导入了 ${list.length} 个活动`);
    } catch { toast('这个文件不是工具箱的备份'); }
  };
  r.readAsText(file);
}

/* ---------- 启动 ---------- */
plans = readLocal() || [];
if (!plans.length) plans = [samplePlan()];
render();
connect();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hadController = Boolean(navigator.serviceWorker.controller);
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((r) => r.update()).catch(() => {}));
}
</script>
