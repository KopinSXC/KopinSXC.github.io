<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d7a50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="活动策划">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>活动策划工具箱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* 版式：像一张活动当天贴在墙上的「运行单」——顶部是活动牌，下方是一页页标签，数字和时间用等宽字排齐 */
  :root {
    --bg: #f3f5f2;
    --paper: #ffffff;
    --ink: #17231d;
    --muted: #5e6b64;
    --line: #dde3de;
    --field: #1d7a50;
    --field-soft: #e3f1e9;
    --field-ink: #ffffff;
    --marker: #f4c84a;
    --marker-soft: #fdf3d3;
    --warn: #b4540f;
    --bad: #b3261e;
    --bad-soft: #fbe7e5;
    --good: #1d7a50;
    --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101512; --paper: #18201b; --ink: #e8efe9; --muted: #9aa8a0; --line: #2b362f;
      --field: #4cc28a; --field-soft: #1b3326; --field-ink: #08140d; --marker: #f4c84a; --marker-soft: #3a3117;
      --warn: #f0a35e; --bad: #f2948c; --bad-soft: #3b1f1d; --good: #4cc28a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101512; --paper: #18201b; --ink: #e8efe9; --muted: #9aa8a0; --line: #2b362f;
    --field: #4cc28a; --field-soft: #1b3326; --field-ink: #08140d; --marker: #f4c84a; --marker-soft: #3a3117;
    --warn: #f0a35e; --bad: #f2948c; --bad-soft: #3b1f1d; --good: #4cc28a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 48px;
  }
  .wrap { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.3; }
  h1 { font-size: 26px; font-weight: 900; }
  h2 { font-size: 19px; }
  h3 { font-size: 16px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--field); outline-offset: 2px; }

  /* 顶部 */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand small { color: var(--muted); }
  .save { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .save[data-s="saved"]::before { background: var(--good); }
  .save[data-s="saving"]::before { background: var(--marker); }
  .save[data-s="error"]::before { background: var(--bad); }

  /* 按钮 */
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--field); }
  .btn.primary { background: var(--field); border-color: var(--field); color: var(--field-ink); font-weight: 700; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--bad); }
  .btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; max-width: 100%; }
  .spacer { flex: 1; }

  /* 首页：活动牌 */
  .plans { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .plan-card { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; }
  .plan-card:hover { border-color: var(--field); }
  .plan-card .meta { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--field-soft); color: var(--field); font-weight: 600; }
  .tag.sample { background: var(--marker-soft); color: var(--warn); }
  .new-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .new-card { text-align: left; border: 1px dashed var(--line); background: transparent; border-radius: var(--radius); padding: 14px; display: grid; gap: 4px; }
  .new-card:hover { border-color: var(--field); background: var(--field-soft); }
  .new-card b { font-size: 15px; }
  .new-card span { font-size: 13px; color: var(--muted); }
  .paste-card { border-style: solid; border-color: var(--field); background: var(--field-soft); }
  .paste-card b { color: var(--field); }
  .modal-box #reqText { font-family: var(--font-body); font-size: 14px; min-height: 180px; }
  .found { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 14px; }
  .found dt { color: var(--muted); }
  .found dd { margin: 0; word-break: break-all; }
  .found .miss { color: var(--muted); font-style: italic; }
  details summary { cursor: pointer; }
  .doc-sec { gap: 10px; }
  .doc-sec.off > :not(.panel-head) { display: none; }
  .doc-sec.off h3 { color: var(--muted); }
  .secno { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--field-soft); color: var(--field); font: 600 13px var(--font-mono); margin-right: 8px; vertical-align: 2px; }
  .inc { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .how { font-size: 14px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 12px; }
  .how summary { color: var(--field); font-weight: 600; }
  .how p { margin-top: 6px; color: var(--ink); }
  .how ul { margin: 6px 0 0; padding-left: 20px; }
  .auto { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .auto b { color: var(--ink); font-weight: 600; }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 16px; font-size: 14px; color: var(--muted); }
  .checks li.pass { color: var(--good); }
  .tabno { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--line); color: var(--muted); font: 600 11px var(--font-mono); margin-right: 5px; vertical-align: 1px; }
  .tab[aria-selected="true"] .tabno { background: var(--field); color: var(--field-ink); }
  .intro { font-size: 14px; color: var(--muted); }
  .intro b { color: var(--field); margin-right: 8px; }
  .stepnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .stepnav .btn { min-height: 48px; padding: 10px 18px; }
  .help { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
  .help li { counter-increment: s; display: grid; grid-template-columns: 36px 1fr; column-gap: 12px; }
  .help li::before { content: counter(s); grid-row: span 2; width: 32px; height: 32px; border-radius: 50%; background: var(--field); color: var(--field-ink); display: grid; place-items: center; font-weight: 700; }
  .help b { font-size: 16px; }
  .help span { color: var(--muted); font-size: 14px; }
  .welcome { border-color: var(--field); }

  /* 活动页头 */
  .board { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 10px; }
  .board .title-input { font-family: var(--font-display); font-weight: 900; font-size: 22px; border: 0; background: transparent; width: 100%; padding: 0; }
  .board .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: none; padding: 10px 12px; white-space: nowrap; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--field); }

  /* 面板 */
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 13px; color: var(--muted); }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
  label.f.wide { grid-column: 1 / -1; }
  input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
    width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; color: var(--ink); min-height: 38px;
  }
  textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { border-color: var(--field); outline: none; }

  /* 统计 */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 2px; }
  .stat b { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--field); }
  .meter.over i { background: var(--bad); }

  /* 可编辑列表 */
  .list { display: grid; gap: 8px; }
  .item { display: grid; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--paper); }
  .item.done { opacity: .6; }
  .item input, .item select { min-height: 34px; padding: 6px 8px; }
  .x { border: 0; background: none; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; font-size: 18px; line-height: 1; }
  .x:hover { color: var(--bad); background: var(--bad-soft); }
  .cols-sports, .cols-outing { grid-template-columns: minmax(0, 2fr) 76px minmax(0, 1.2fr) minmax(0, 2fr) 32px; }
  .cols-gala { grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) 96px 76px 32px; }
  .cols-lecture { grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) 76px 32px; }
  .cols-sched { grid-template-columns: 96px minmax(0, 1.6fr) 70px minmax(0, 1fr) minmax(0, 1fr) 32px; }
  .cols-budget { grid-template-columns: minmax(0, 1.8fr) 96px 64px 84px minmax(0, 1fr) 80px 32px; }
  .cols-task { grid-template-columns: 32px minmax(0, 2fr) minmax(0, 1fr) 140px 32px; }
  .colhead { display: grid; gap: 8px; padding: 0 9px; font-size: 12px; color: var(--muted); }
  .time { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--field); font-weight: 500; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 13px; min-height: 32px; }
  .chip.on { background: var(--field-soft); border-color: var(--field); color: var(--field); font-weight: 600; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--field); }
  .late { color: var(--bad); font-size: 12px; }

  @media (max-width: 680px) {
    .colhead { display: none; }
    .cols-sports, .cols-outing, .cols-gala, .cols-lecture, .cols-sched, .cols-budget, .cols-task { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .item > .full { grid-column: 1 / -1; }
    .item > .x { justify-self: end; }
    .cols-task { grid-template-columns: 32px repeat(2, minmax(0, 1fr)); }
    .cols-task > .full { grid-column: 2 / -1; }
  }

  /* 表格 */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--bg); }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }
  td select, td input { min-height: 32px; padding: 4px 6px; width: 72px; }
  .rest { color: var(--muted); }

  /* 分组 */
  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .group { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; }
  .group input { font-weight: 700; }
  .group .members { font-size: 13px; color: var(--muted); line-height: 1.8; word-break: break-all; }

  /* 排行 */
  .rank { display: grid; gap: 8px; }
  .rank-row { display: grid; grid-template-columns: 36px minmax(0, 120px) 1fr 64px; gap: 10px; align-items: center; }
  .rank-row .place { font-family: var(--font-display); font-weight: 900; font-size: 18px; text-align: center; }
  .rank-row:nth-child(1) .place { color: var(--warn); }
  .rank-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .bar { height: 14px; border-radius: 7px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--field); border-radius: 7px; }
  .rank-row:nth-child(1) .bar i { background: var(--marker); }
  .rank-row b { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }

  /* 大屏 */
  .bigscreen { position: fixed; inset: 0; z-index: 50; background: var(--bg); padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); display: grid; grid-template-rows: auto 1fr; gap: 24px; overflow: auto; }
  .bigscreen h2 { font-size: clamp(24px, 4vw, 44px); }
  .bigscreen .rank-row { grid-template-columns: 64px minmax(0, 220px) 1fr 110px; gap: 16px; }
  .bigscreen .rank-row .place { font-size: clamp(24px, 4vw, 40px); }
  .bigscreen .rank-row .name { font-size: clamp(18px, 3vw, 30px); }
  .bigscreen .rank-row b { font-size: clamp(20px, 3.4vw, 36px); }
  .bigscreen .bar { height: clamp(18px, 3vw, 32px); border-radius: 16px; }
  .bigscreen .bar i { border-radius: 16px; transition: width .6s ease; }

  /* 策划案预览 */
  .doc { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: clamp(16px, 5vw, 48px); font-size: 15px; line-height: 1.9; display: grid; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; min-width: 0; }
  .doc h1 { text-align: center; font-size: 22px; margin-bottom: 8px; }
  .doc h2 { font-size: 16px; margin-top: 8px; }
  .doc p { text-indent: 2em; white-space: pre-wrap; }
  .doc .table-wrap { border-radius: 0; }
  .doc th { color: var(--ink); }

  /* 弹窗 */
  .modal { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; }
  .modal-box { background: var(--paper); border-radius: var(--radius); padding: 20px; width: min(520px, 100%); max-height: 85vh; overflow: auto; display: grid; gap: 14px; }
  .modal-box textarea { min-height: 200px; font-family: var(--font-mono); font-size: 12px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 20px; border: 1px dashed var(--line); border-radius: 10px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap" id="app"></div>
<div class="modal" id="modal" hidden></div>
<div class="bigscreen" id="big" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';

/* ---------- 小工具 ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : 0; };
const hm = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const money = (n) => '¥' + (Math.round(n * 100) / 100).toLocaleString('zh-CN');
const CN = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六'];
const clone = (o) => JSON.parse(JSON.stringify(o));

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => (t.hidden = true), 2200);
}

function modal(html) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  return m.firstElementChild;
}
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; }

function confirmBox(msg, okText = '确定') {
  return new Promise((resolve) => {
    const box = modal(`<p>${esc(msg)}</p><div class="row"><span class="spacer"></span><button class="btn" data-no>取消</button><button class="btn primary" data-yes>${esc(okText)}</button></div>`);
    box.querySelector('[data-no]').onclick = () => { closeModal(); resolve(false); };
    box.querySelector('[data-yes]').onclick = () => { closeModal(); resolve(true); };
  });
}

/* ---------- 活动类型与模板 ---------- */
const TYPES = {
  sports: { label: '趣味运动会', blurb: '多个项目轮转，分组比赛，按名次积分', item: '比赛项目', scoring: 'rank', cols: ['name', 'minutes', 'venue', 'note'] },
  gala: { label: '晚会和比赛', blurb: '节目单、串场时间、评委打分', item: '节目', scoring: 'judge', cols: ['name', 'who', 'cat', 'minutes'] },
  lecture: { label: '讲座和主题教育', blurb: '议程、签到、物资和宣传', item: '议程', scoring: 'off', cols: ['name', 'who', 'minutes'] },
  outing: { label: '团建和户外', blurb: '环节安排、分组挑战、预算', item: '活动环节', scoring: 'rank', cols: ['name', 'minutes', 'venue', 'note'] },
};
const COL_LABEL = { name: '名称', minutes: '分钟', venue: '场地', note: '规则 / 说明', who: '', cat: '类型' };
const WHO_LABEL = { gala: '表演者', lecture: '主讲 / 负责人' };
const GALA_CATS = ['歌舞', '语言类', '器乐', '其他'];
const BUDGET_CATS = ['奖品', '比赛物资', '宣传', '餐饮', '交通', '场地', '其他'];
const GROUP_THEMES = {

const CN_DIGIT = { 零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
function cnInt(s) {
  s = String(s || '').trim();
  if (/^\d+$/.test(s)) return +s;
  const m = /^([一二两三四五六七八九])?(十)?([一二三四五六七八九])?$/.exec(s);
  if (!m || !s) return NaN;
  if (!m[2]) return CN_DIGIT[m[1]] ?? NaN;
  return (m[1] ? CN_DIGIT[m[1]] : 1) * 10 + (m[3] ? CN_DIGIT[m[3]] : 0);
}
const NUM = '(\\d+|[一二两三四五六七八九十]{1,3})';
const BULLET = /^\s*(?:\d+[.、)）]|[（(]\d+[)）]|[一二三四五六七八九十]+[、.]|[-•·*])\s*/;
const ITEM_KEYS = {
  sports: '比赛项目|运动项目|项目设置|项目',
  gala: '节目单|节目安排|节目|演出内容',
  lecture: '活动议程|议程|活动流程|流程安排|流程|环节',
  outing: '活动环节|活动内容|行程安排|行程|环节|流程',
};
const TYPE_WORDS = {
  sports: /运动会|趣味赛|接力|拔河|跳绳|田径|体育|球赛/g,
  gala: /晚会|演出|节目|文艺|歌手|才艺|大赛|评委|汇演/g,
  lecture: /讲座|报告会|主题教育|宣讲|分享会|座谈|培训|班会|论坛/g,
  outing: /团建|户外|拓展|徒步|露营|春游|秋游|研学|定向|烧烤/g,
};

function grab(text, re) { const m = re.exec(text); return m ? m[1].trim() : ''; }

function extractList(text, keys) {
  const re = new RegExp(`(?:${keys})[ \\t]*(?:有|包括|包含|如下|安排为|:)[ \\t:]*([^\\n]*)((?:\\n[ \\t]*(?:\\d+[.、)）]|[（(]\\d+[)）]|[一二三四五六七八九十]+[、.]|[-•·*])[^\\n]+)*)`);
  const m = re.exec(text);
  if (!m) return [];
  const parts = [];
  const inline = m[1].replace(/等.{0,6}$/, '').replace(/[。]$/, '').trim();
  if (inline) parts.push(...inline.replace(BULLET, '').split(/[、，,；;]/));
  if (m[2]) parts.push(...m[2].split('\n').map((l) => l.replace(BULLET, '')));
  return parts.map((s) => s.trim().replace(/[。；;，,]$/, '')).filter((s) => s && s.length <= 60);
}

function parseItem(type, s) {
  const r = { name: s, minutes: 0, who: '', venue: '' };
  const min = /(\d+)\s*(?:分钟|min)/.exec(s);
  if (min) { r.minutes = +min[1]; r.name = r.name.replace(min[0], ''); }
  const who = /[（(]([^）)]+)[）)]/.exec(r.name);
  if (who && !/^\d+$/.test(who[1])) { r.who = who[1]; r.name = r.name.replace(who[0], ''); }
  const parts = r.name.split(/\s+[-—–|｜]\s*|\s{2,}|\t|[-—–|｜]{1,2}(?=[^\d])/).map((x) => x.trim()).filter(Boolean);
  r.name = (parts[0] || s).replace(/[，,：:]$/, '').trim();
  if (!r.who && parts[1]) { if (type === 'sports' || type === 'outing') r.venue = parts[1]; else r.who = parts[1]; }
  return r;
}

function parseDate(text) {
  let y, mo, d;
  let m = /(\d{4})\s*[年\-/.]\s*(\d{1,2})\s*[月\-/.]\s*(\d{1,2})/.exec(text);
  if (m) [, y, mo, d] = m.map(Number);
  else if ((m = /(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/.exec(text))) {
    [, mo, d] = m.map(Number);
    const now = new Date();
    y = now.getFullYear();
    if (new Date(y, mo - 1, d) < new Date(now.toDateString())) y++;
  }
  if (!y || mo < 1 || mo > 12 || d < 1 || d > 31) return '';
  return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

function parseTime(text) {
  const m = /(上午|早上|早晨|中午|下午|晚上|傍晚)?\s*(\d{1,2})\s*(?:[:：]\s*(\d{2})|点\s*(半|\d{1,2}分?)?)/.exec(text.replace(/\d{4}\s*[年\-/.]\s*\d{1,2}\s*[月\-/.]\s*\d{1,2}[日号]?/g, ''));
  if (!m) return '';
  let h = +m[2];
  const min = m[3] ? +m[3] : m[4] === '半' ? 30 : m[4] ? parseInt(m[4], 10) : 0;
  if (/下午|晚上|傍晚/.test(m[1] || '') && h < 12) h += 12;
  if (m[1] === '中午' && h < 3) h += 12;
  if (h > 23 || min > 59) return '';
  return `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;
}

function parseRequirements(raw) {
  const text = String(raw || '')
    .replace(/\r/g, '')
    .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
    .replace(/：/g, ':');
  let type = 'lecture';
  let best = 0;
  for (const [k, re] of Object.entries(TYPE_WORDS)) {
    const n = (text.match(re) || []).length;
    if (n > best) { best = n; type = k; }
  }
  const f = {};
  f.name = grab(text, /(?:活动名称|活动标题|名称|标题)\s*:\s*([^\n]+)/)
    || grab(text, /[“"《「]([^”"》」\n]{2,24}(?:运动会|晚会|比赛|大赛|讲座|活动|团建|拓展|演出|报告会))[”"》」]/)
    || grab(text, /^\s*(?:关于)?(?:举办|开展|组织|召开|举行)?\s*([^\n:]{2,30}?(?:运动会|晚会|比赛|大赛|讲座|活动|团建|拓展|演出|报告会))\s*(?:的)?(?:策划案?|方案|通知|要求|安排)?\s*$/m).replace(/[“”"「」《》]/g, '');
  f.date = parseDate(text);
  f.startTime = parseTime(grab(text, /(?:时间|开始)\s*:\s*([^\n]+)/) || text);
  f.location = grab(text, /(?:活动地点|地点|场地|地址)\s*:\s*([^\n，。；;]+)/) || grab(text, /在\s*([^\s，。、\n]{2,16}?)\s*(?:举行|举办|进行|开展|召开)/);
  f.organizer = grab(text, /(?:主办单位|主办方|主办|承办单位|承办|组织单位)\s*:\s*([^\n，。；;]+)/);
  f.audience = grab(text, /(?:参与对象|参加对象|活动对象|面向对象|对象)\s*:\s*([^\n，。；;]+)/) || grab(text, /面向\s*([^\n，。；;]{2,20})/);
  f.theme = grab(text, /(?:活动主题|主题|口号)\s*:\s*[“"「]?([^\n”"」]+)/).replace(/[。]$/, '');
  const head = /(?:人数|规模)\s*:?\s*(?:约|大约|预计|共)?\s*(\d+)/.exec(text) || /(?:约|大约|预计|共|总共|计划)\s*(\d+)\s*(?:人|名)/.exec(text) || /(\d+)\s*(?:人|名)(?:左右|参加|参与|报名)/.exec(text);
  if (head) f.headcount = +head[1];
  const money = /(?:预算|经费)[^\d\n]{0,8}(\d+(?:\.\d+)?)\s*(万|千)?/.exec(text);
  if (money) f.budgetLimit = Math.round(+money[1] * (money[2] === '万' ? 10000 : money[2] === '千' ? 1000 : 1));
  const groups = new RegExp(`(?:分(?:成|为)?|共|组成)\\s*${NUM}\\s*(?:个)?(?:小组|组|队|支队伍|支队)`).exec(text);
  if (groups) f.groupCount = cnInt(groups[1]);
  const judges = new RegExp(`${NUM}\\s*(?:位|名|个)?评委`).exec(text);
  if (judges) f.judges = cnInt(judges[1]);
  f.roster = grab(text, /(?:参赛名单|人员名单|名单|成员)\s*:\s*([^\n]+)/);
  const items = extractList(text, ITEM_KEYS[type]).map((s) => parseItem(type, s)).filter((x) => x.name);
  for (const k of Object.keys(f)) if (f[k] === '' || Number.isNaN(f[k])) delete f[k];
  return { type, fields: f, items, text: String(raw || '') };
}

function planFromRequirements(r) {
  const p = makePlan(r.type);
  const f = r.fields;
  for (const k of ['name', 'date', 'startTime', 'location', 'organizer', 'audience', 'theme', 'headcount', 'budgetLimit', 'roster']) if (f[k] != null) p[k] = f[k];
  if (f.judges) p.judges = Math.max(1, Math.min(15, f.judges));
  if (r.items.length) {
    const def = TEMPLATES[r.type].items[0];
    p.items = r.items.map((it) => {
      const x = itemFrom(r.type, def);
      Object.assign(x, { name: it.name, venue: it.venue || '', who: it.who || '', note: '' });
      x.minutes = it.minutes || (r.type === 'gala' ? 5 : r.type === 'lecture' ? 15 : r.type === 'outing' ? 30 : 15);
      if (r.type === 'gala') x.cat = /相声|小品|朗诵|演讲|脱口秀|话剧/.test(it.name) ? '语言类' : /奏|琴|筝|鼓|笛|乐队/.test(it.name) ? '器乐' : '歌舞';
      return x;
    });
  }
  if (f.groupCount) p.groupCount = Math.max(0, Math.min(24, f.groupCount));
  if (p.groupCount || f.roster) applyGroups(p, false);
  p.content = sampleText(p, 'content');
  p.org = sampleText(p, 'org');
  p.requirements = r.text;
  p.schedule = genSchedule(p);
  recalcDue(p);
  return p;
}

async function readRequirementFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.docx')) {
    if (!window.JSZip) throw new Error('读取 Word 需要的组件没有加载出来');
    const zip = await JSZip.loadAsync(file);
    const xml = await zip.file('word/document.xml')?.async('string');
    if (!xml) throw new Error('这个 Word 文件里没有找到正文');
    return xml.replace(/<w:tab\/>/g, '\t').replace(/<\/w:p>/g, '\n').replace(/<w:br\/>/g, '\n').replace(/<[^>]+>/g, '')
      .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
  }
  if (name.endsWith('.doc')) throw new Error('旧版 .doc 文件读不了，请在 WPS 或 Word 里另存为 .docx，或者直接复制文字粘贴进来');
  if (name.endsWith('.pdf')) throw new Error('PDF 读不了，请复制里面的文字粘贴进来');
  return file.text();
}

function makePlan(type) {
  const t = TEMPLATES[type];
  const p = {
    id: newId(), type, name: t.name, date: '', startTime: t.startTime, location: '', organizer: '',
    audience: '', headcount: t.headcount, theme: '', budgetLimit: t.budgetLimit,
    ...TEXTS[type],
    scoring: TYPES[type].scoring, rankPoints: [10, 8, 6, 5, 4, 3, 2, 1], results: {}, bonus: {},
    judges: t.judges || 5, jscores: {},
    roster: '', groupTheme: 'planet', groupCount: type === 'gala' || type === 'lecture' ? 0 : 6, groups: [],
    items: t.items.map((r) => itemFrom(type, r)),
    schedule: [],
    budget: t.budget.map(([name, cat, qty, price]) => ({ id: newId(), name, cat, qty, price, owner: '', bought: false })),
    tasks: t.tasks.map(([task, before]) => ({ id: newId(), task, owner: '', before, due: '', done: false })),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
  };
  if (p.groupCount) p.groups = Array.from({ length: p.groupCount }, (_, i) => ({ id: newId(), name: groupName(p.groupTheme, i), leader: '', members: [] }));
  p.schedule = genSchedule(p);
  p.docOff = {};
  for (const k of ['org', 'content', 'prep', 'follow', 'effect']) p[k] = sampleText(p, k);
  return p;
}

function itemFrom(type, r) {
  const it = { id: newId(), name: '', minutes: 15, venue: '', note: '', who: '', cat: '' };
  if (type === 'sports' || type === 'outing') Object.assign(it, { name: r[0], minutes: r[1], venue: r[2], note: r[3] });
  if (type === 'gala') Object.assign(it, { name: r[0], who: r[1], cat: r[2], minutes: r[3] });
  if (type === 'lecture') Object.assign(it, { name: r[0], who: r[1], minutes: r[2] });
  return it;
}

function nextSaturday() {

  d.setDate(d.getDate() + ((6 - d.getDay() + 7) % 7 || 7) + 7);
  return d.toISOString().slice(0, 10);
}

/* ---------- 自动生成 ---------- */
function genSchedule(p) {
  const S = (title, minutes, place = '', note = '', owner = '') => ({ id: newId(), title, minutes, place, owner, note });
  const items = p.items.filter((i) => i.name.trim());
  if (p.type === 'sports') {
    const out = [S('入场签到', 20, '主席台', '各组组长到主席台签到、领号码布'), S('开幕式', 15, '主席台', '主持人开场、领导致辞、运动员宣誓'), S('集体热身', 10, '主场地')];
    const G = p.groups.length;
    if (!items.length) return out;
    if (G < 2) {
      items.forEach((it) => out.push(S(it.name, num(it.minutes) + 5, it.venue, it.note)));
    } else {
      const R = Math.max(G, items.length);
      const len = Math.max(...items.map((i) => num(i.minutes))) + 5;
      for (let r = 0; r < R; r++) {
        const note = p.groups.map((g, gi) => { const s = (gi + r) % R; return `${g.name}→${s < items.length ? items[s].name : '休息'}`; }).join('；');
        out.push(S(`第 ${r + 1} 轮比赛`, len, '各项目场地', note));
      }
    }
    out.push(S('成绩统计', 15, '裁判台', '裁判汇总成绩，现场公布总分'), S('颁奖与闭幕', 20, '主席台', '颁发团体奖，合影留念'));
    return out;
  }
  if (p.type === 'gala') {
    const out = [S('观众入场', 30, '', '播放暖场音乐和视频'), S('开场与主持人致辞', 8)];
    const left = [...items];
    const ordered = [];
    while (left.length) {
      const last = ordered[ordered.length - 1];
      let k = left.findIndex((i) => !last || i.cat !== last.cat);
      if (k < 0) k = 0;
      ordered.push(left.splice(k, 1)[0]);
    }
    ordered.forEach((it, i) => {
      out.push(S(it.name, num(it.minutes) + 2, '舞台', '含 2 分钟换场和串词', it.who));
      if (ordered.length >= 8 && i === Math.floor(ordered.length / 2) - 1) out.push(S('中场互动抽奖', 10, '舞台'));
    });
    out.push(S('评委合议与统分', 10, '', '主持人带领观众互动'), S('颁奖', 15, '舞台'), S('合影与退场', 10));
    return out;
  }
  return items.map((it) => S(it.name, num(it.minutes), it.venue, it.note, it.who));
}

function rotation(p) {
  const items = p.items.filter((i) => i.name.trim());
  const G = p.groups.length;
  if (p.type !== 'sports' || G < 2 || !items.length) return null;
  const R = Math.max(G, items.length);
  return Array.from({ length: R }, (_, r) => p.groups.map((g, gi) => { const s = (gi + r) % R; return s < items.length ? items[s].name : null; }));
}

function parseRoster(text) {
  return String(text || '').split(/[\s,，、;；]+/).map((s) => s.trim()).filter(Boolean);
}

function applyGroups(p, keepNames) {
  const n = Math.max(0, Math.min(24, Math.round(num(p.groupCount))));
  const names = parseRoster(p.roster);
  for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [names[i], names[j]] = [names[j], names[i]]; }
  const old = p.groups;
  p.groups = Array.from({ length: n }, (_, i) => ({
    id: old[i]?.id || newId(),
    name: keepNames && old[i]?.name ? old[i].name : groupName(p.groupTheme, i),
    leader: '', members: [],
  }));
  names.forEach((name, i) => p.groups[i % n]?.members.push(name));
  p.groups.forEach((g) => (g.leader = g.members[0] || ''));
}

function recalcDue(p) {
  p.tasks.forEach((t) => {
    if (p.date && t.before !== '' && t.before != null) {
      const d = new Date(p.date + 'T00:00:00');
      d.setDate(d.getDate() - num(t.before));
      t.due = d.toISOString().slice(0, 10);
    }
  });
}

/* ---------- 计算 ---------- */
function timeline(p) {
  let t = toMin(p.startTime);
  return p.schedule.map((s) => { const start = t; t += num(s.minutes); return { start, end: t }; });
}

function standings(p) {
  const pts = p.rankPoints;
  const rows = p.groups.map((g) => {
    let total = num(p.bonus?.[g.id]);
    for (const it of p.items) {
      const r = p.results?.[it.id]?.[g.id];
      if (r) total += num(pts[r - 1]);
    }
    return { id: g.id, name: g.name, total };
  }).sort((a, b) => b.total - a.total);
  rows.forEach((r, i) => (r.place = i && r.total === rows[i - 1].total ? rows[i - 1].place : i + 1));
  return rows;
}

function judged(p) {
  const rows = p.items.filter((i) => i.name.trim()).map((it) => {
    const raw = (p.jscores?.[it.id] || []).slice(0, p.judges);
    const vals = raw.filter((v) => v !== '' && v != null && Number.isFinite(+v)).map(Number);
    let used = vals;
    if (vals.length >= 5) {
      const s = [...vals].sort((a, b) => a - b);
      used = s.slice(1, -1);
    }
    const avg = used.length ? used.reduce((a, b) => a + b, 0) / used.length : null;
    return { id: it.id, name: it.name, who: it.who, avg, count: vals.length };
  }).sort((a, b) => (b.avg ?? -1) - (a.avg ?? -1));
  rows.forEach((r, i) => (r.place = r.avg == null ? '' : i && r.avg === rows[i - 1].avg ? rows[i - 1].place : i + 1));
  return rows;
}

function budgetSum(p) {
  const total = p.budget.reduce((s, b) => s + num(b.qty) * num(b.price), 0);
  const bought = p.budget.filter((b) => b.bought).reduce((s, b) => s + num(b.qty) * num(b.price), 0);
  const byCat = {};
  p.budget.forEach((b) => (byCat[b.cat || '其他'] = (byCat[b.cat || '其他'] || 0) + num(b.qty) * num(b.price)));
  return { total, bought, byCat };
}

/* ---------- 保存 ---------- */
const LS_KEY = 'planner.v1';
let plans = [];
let curId = null;
let tab = 'overview';
let remote = null;
let saveState = 'local';
const timers = {};
const writing = {};

function readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch { return null; } }
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(plans.filter((p) => !p.sample))); } catch { /* 浏览器不让存时，仍保存到账号里 */ } }

function setSave(s) {
  saveState = s;
  const el = $('#save');
  if (el) { el.dataset.s = s === 'local' && !IN_CLAUDE ? 'saved' : s; el.textContent = SAVE_TEXT[s]; }
}
const IN_CLAUDE = Boolean(window.claude?.use);
const SAVE_TEXT = { local: IN_CLAUDE ? '仅保存在本设备' : '已保存在本机', saving: '保存中…', saved: '已保存到账号', error: '保存失败，稍后自动重试' };

function touch(p) {
  if (p.sample) delete p.sample;
  p.updatedAt = new Date().toISOString();
  writeLocal();
  if (!remote) return;
  setSave('saving');
  clearTimeout(timers[p.id]);
  timers[p.id] = setTimeout(() => flush(p.id), 700);
}

async function flush(id) {
  if (writing[id]) { writing[id].again = true; return; }
  const p = plans.find((x) => x.id === id);
  if (!p || !remote) return;
  writing[id] = { again: false };
  try {
    await remote.doc(id).set(clone(p));
    setSave('saved');
  } catch (e) {
    setSave('error');
    if (e?.code === 'unavailable' || e?.code === 'resource_exhausted') setTimeout(() => flush(id), 4000);
  }
  const again = writing[id].again;
  delete writing[id];
  if (again) flush(id);
}

async function removePlan(id) {
  plans = plans.filter((p) => p.id !== id);
  writeLocal();
  if (remote) { try { await remote.doc(id).delete(); } catch { setSave('error'); } }
}

async function connect() {
  const c = window.claude;
  if (!c?.use) return;
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
  if (!db || !user) return;
  const uid = await user.id();
  if (!uid) return;
  const col = db.collection('data/users/' + uid);
  try {
    const snap = await col.get();
    const saved = snap.docs.filter((d) => d.exists && d.data()?.type).map((d) => clone(d.data()));
    remote = col;
    if (saved.length) {
      const sample = plans.find((p) => p.sample);
      plans = saved.sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
      if (curId && !plans.some((p) => p.id === curId)) curId = sample && curId === sample.id ? null : curId;
    } else {
      for (const p of plans.filter((x) => !x.sample)) await col.doc(p.id).set(clone(p));
    }
    writeLocal();
    setSave('saved');
    render();
  } catch {
    remote = null;
    setSave('local');
  }
}

/* ---------- 导出 ---------- */
const MIME = { csv: 'text/csv', json: 'application/json', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
const mimeOf = (name) => MIME[name.split('.').pop()] || 'application/octet-stream';

async function toBase64(data) {
  const buf = new Uint8Array(await (data instanceof Blob ? data : new Blob([data])).arrayBuffer());
  let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}

async function offerFile(filename, data, fallbackText) {
  if (IN_CLAUDE) {
    const dl = await window.claude.use('downloads');
    if (dl) {
      try { await dl.save({ filename, data }); return; }
      catch (e) { if (e?.code === 'declined') return; }
    }
  } else if (window.AndroidBridge) {
    window.AndroidBridge.saveFile(filename, await toBase64(data), mimeOf(filename));
    return;
  } else {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mimeOf(filename) });
    const file = new File([blob], filename, { type: mimeOf(filename) });
    const download = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    };
    if (/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare?.({ files: [file] })) {
      // 手机上分两步：文件先生成好，再由这次点击直接打开分享菜单。
      // 生成文件要花时间，如果在原来那次点击里等它，系统会认为分享不是用户触发的而拒绝。
      const kb = Math.max(1, Math.round(blob.size / 1024));
      // 「下载并打开」能选 WPS、微信等 App；网页直接分享时，这些 App 不会出现在分享菜单里
      const box = modal(`<h3>文件已生成</h3><p>${esc(filename)}<span class="hint">（${kb} KB）</span></p>
        <button class="btn primary" data-dl style="min-height:52px">下载并打开</button>
        <p class="hint">打开后点分享按钮，就能选 WPS、微信，或者「存储到文件」。</p>
        <p class="hint" data-err hidden></p>
        <div class="row"><button class="btn small ghost" data-share>用分享菜单发送</button><span class="spacer"></span><button class="btn" data-close>关闭</button></div>`);
      box.querySelector('[data-close]').onclick = closeModal;
      box.querySelector('[data-dl]').onclick = () => { download(); closeModal(); };
      box.querySelector('[data-share]').onclick = () => {
        // 只分享文件本身，不附带文字，避免有的 App 把文字当成内容存下来
        navigator.share({ files: [file] }).then(closeModal).catch((e) => {
          if (e?.name === 'AbortError') return;
          const err = box.querySelector('[data-err]');
          err.hidden = false;
          err.textContent = `没能打开分享菜单（${e?.name || '未知错误'}：${e?.message || ''}）。可以点「下载并打开」。`;
        });
      };
      return;
    }
    download();
    return;
  }
  if (fallbackText != null) {
    const box = modal(`<h3>${esc(filename)}</h3><p class="hint">这里不能直接下载。请全选复制下面的内容，粘贴到 Excel 或 WPS 里。</p><textarea id="fallbackText" readonly>${esc(fallbackText)}</textarea><div class="row"><span class="spacer"></span><button class="btn" data-close>关闭</button><button class="btn primary" data-copy>复制</button></div>`);
    box.querySelector('[data-close]').onclick = closeModal;
    box.querySelector('[data-copy]').onclick = () => copyText(fallbackText, box.querySelector('textarea'));
  } else {
    toast('这个页面暂时不能下载文件');
  }
}

async function copyText(text, area) {
  if (window.AndroidBridge) { window.AndroidBridge.copy(text); return; }
  try { await navigator.clipboard.writeText(text); toast('已复制'); }
  catch { if (area) { area.focus(); area.select(); } toast('请长按选中后复制'); }
}

function csv(rows) {
  const cell = (v) => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + rows.map((r) => r.map(cell).join(',')).join('\r\n');
}

function exportCsv(kind) {
  const p = cur();
  let rows, name;
  if (kind === 'schedule') {
    const tl = timeline(p);
    rows = [['时间', '环节', '分钟', '地点', '负责人', '说明'], ...p.schedule.map((s, i) => [`${hm(tl[i].start)}-${hm(tl[i].end)}`, s.title, s.minutes, s.place, s.owner, s.note])];
    name = '流程';
  } else if (kind === 'groups') {
    rows = [['组名', '组长', '人数', '成员'], ...p.groups.map((g) => [g.name, g.leader, g.members.length, g.members.join('、')])];
    name = '分组';
  } else if (kind === 'scores') {
    if (p.scoring === 'judge') {
      rows = [['名次', '节目', '表演者', '最终得分', '评委人数'], ...judged(p).map((r) => [r.place, r.name, r.who, r.avg == null ? '' : r.avg.toFixed(2), r.count])];
    } else {
      const items = p.items.filter((i) => i.name.trim());
      rows = [['名次', '队伍', ...items.map((i) => i.name), '加分', '总分'], ...standings(p).map((s) => [s.place, s.name, ...items.map((it) => { const r = p.results?.[it.id]?.[s.id]; return r ? `第${r}名(${num(p.rankPoints[r - 1])}分)` : ''; }), num(p.bonus?.[s.id]) || '', s.total])];
    }
    name = '成绩';
  } else {
    const { total } = budgetSum(p);
    rows = [['物品', '类别', '数量', '单价', '小计', '负责人', '状态'], ...p.budget.map((b) => [b.name, b.cat, b.qty, b.price, num(b.qty) * num(b.price), b.owner, b.bought ? '已买' : '待买']), ['合计', '', '', '', total, '', '']];
    name = '预算';
  }
  const text = csv(rows);
  offerFile(`${p.name}-${name}.csv`, text, text.replace(/^﻿/, '').replace(/,/g, '\t'));
}

/* 「填入参考写法」用的范文，会用上已经填好的活动信息 */

    background: TEXTS[p.type].background,

      lecture: `本次活动以专题讲座为主要形式，邀请嘉宾围绕主题作报告，并安排互动问答环节，帮助同学们加深理解。`,

    effect: {
      sports: `1. 预计 ${head} 人参加，各组完成全部比赛项目。\n2. 同学之间增进了解，集体凝聚力明显提升。\n3. 活动后发放问卷，满意度达到 90% 以上。`,
      gala: `1. 预计 ${head} 名观众到场，晚会按时顺利完成。\n2. 为同学们提供展示才艺的舞台，涌现一批优秀节目。\n3. 活动后发放问卷，满意度达到 90% 以上。`,
      lecture: `1. 预计 ${head} 人参加，到场率达到 90% 以上。\n2. 同学们对主题有更深的理解，互动问答积极。\n3. 活动后收集反馈，满意度达到 90% 以上。`,
      outing: `1. 预计 ${head} 人参加，全程安全、无人员受伤。\n2. 成员之间增进了解，团队协作能力得到锻炼。\n3. 活动后收集反馈，满意度达到 90% 以上。`,

function docChecks(p) {
  const lines = (s) => String(s || '').split('\n').filter((x) => x.trim()).length;
  const bs = budgetSum(p);
  return [
    ['写了活动背景', String(p.background || '').trim().length >= 20],
    ['活动目的至少分 2 条写', lines(p.goals) >= 2],
    ['填了日期和地点', Boolean(p.date && String(p.location || '').trim())],
    ['填了参与对象和人数', Boolean(String(p.audience || '').trim() && num(p.headcount))],
    ['当天流程已经排好', p.schedule.length > 0],
    ['每个任务都有负责人', p.tasks.length > 0 && p.tasks.every((t) => String(t.owner || '').trim())],
    ['预算有明细，而且没超上限', p.budget.length > 0 && (!num(p.budgetLimit) || bs.total <= num(p.budgetLimit))],
    ['安全预案至少写了 2 条', lines(p.safety) >= 2],
    ['写了宣传方案', String(p.publicity || '').trim().length > 0],
  ];
}

const sectionOn = (p, key) => !p.docOff?.[key];

function proposal(p) {
  const blocks = [];
  let n = 0;
  const H = (t) => blocks.push({ h: `${CN[n++] || n}、${t}` });
  const P = (t) => String(t || '').split('\n').filter((x) => x.trim()).forEach((x) => blocks.push({ p: x }));
  const TB = (head, rows) => rows.length && blocks.push({ table: [head, ...rows] });
  const dateText = p.date ? new Date(p.date + 'T00:00:00').toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }) : '待定';
  const tl = timeline(p);
  const end = tl.length ? tl[tl.length - 1].end : toMin(p.startTime);
  const items = p.items.filter((i) => i.name.trim());
  const bs = budgetSum(p);

  const write = {
    basic() {
      H('时间、地点与参与对象');
      P(`活动时间：${dateText} ${p.startTime}—${hm(end)}`);
      P(`活动地点：${p.location || '待定'}`);
      P(`参与对象：${p.audience || '待定'}，预计 ${num(p.headcount) || '若干'} 人。`);
    },
    theme() { if (String(p.theme || '').trim()) { H('活动主题'); P(p.theme); } },
    content() {
      const hasText = String(p.content || '').trim();
      const table = p.type === 'gala' || p.type === 'sports' || p.type === 'outing';
      if (!hasText && !(table && items.length)) return;
      H('活动内容与形式');
      P(p.content);
      if (p.type === 'gala') TB(['序号', '节目', '表演者', '类型', '时长'], items.map((i, k) => [k + 1, i.name, i.who, i.cat, `${num(i.minutes)} 分钟`]));
      else if (table) TB(['名称', '时长', '场地', '规则 / 说明'], items.map((i) => [i.name, `${num(i.minutes)} 分钟`, i.venue, i.note]));
    },
    flow() {
      if (!p.schedule.length) return;
      H('活动当天流程');
      TB(['时间', '环节', '地点', '负责人 / 说明'], p.schedule.map((s, i) => [`${hm(tl[i].start)}—${hm(tl[i].end)}`, s.title, s.place, [s.owner, s.note].filter(Boolean).join('：')]));
    },
    groups() {
      if (!p.groups.length) return;
      H('分组安排');
      TB(['组名', '组长', '人数', '成员'], p.groups.map((g) => [g.name, g.leader, g.members.length || '', g.members.join('、')]));
    },
    scoring() {
      if (p.scoring === 'rank' && p.groups.length) {
        H('计分与评奖办法');
        P(`每个项目按名次积分：${p.rankPoints.map((v, i) => `第${i + 1}名 ${v} 分`).join('，')}。各项目积分相加为团体总分，按总分评出团体名次。`);
      } else if (p.scoring === 'judge') {
        H('计分与评奖办法');
        P(`由 ${p.judges} 位评委现场打分（满分 10 分）。${p.judges >= 5 ? '去掉一个最高分和一个最低分后，' : ''}取平均分作为节目最终得分，保留两位小数，按得分高低评奖。`);
      }
    },
    tasks() {
      if (!p.tasks.length) return;
      H('人员分工');
      TB(['任务', '负责人', '截止日期', '状态'], [...p.tasks].sort((a, b) => String(a.due).localeCompare(String(b.due))).map((t) => [t.task, t.owner || '待定', t.due || '待定', t.done ? '已完成' : '进行中']));
    },
    budget() {
      if (!p.budget.length) return;
      H('经费预算');
      TB(['物品', '类别', '数量', '单价', '小计'], [...p.budget.map((b) => [b.name, b.cat, num(b.qty), money(num(b.price)), money(num(b.qty) * num(b.price))]), ['合计', '', '', '', money(bs.total)]]);
      if (num(p.budgetLimit)) P(`预算上限 ${money(num(p.budgetLimit))}，${bs.total > num(p.budgetLimit) ? `超出 ${money(bs.total - num(p.budgetLimit))}，需要调整。` : `结余 ${money(num(p.budgetLimit) - bs.total)}。`}`);
    },
  };

  for (const s of DOC_SECTIONS) {
    if (!sectionOn(p, s.key)) continue;
    if (write[s.key]) write[s.key]();
    else if (String(p[s.key] || '').trim()) { H(s.title); P(p[s.key]); }
  }
  return { title: p.name + '策划案', blocks, footer: [p.organizer, new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' })].filter(Boolean) };
}

function proposalHtml(doc) {
  return `<h1>${esc(doc.title)}</h1>` + doc.blocks.map((b) => {
    if (b.h) return `<h2>${esc(b.h)}</h2>`;
    if (b.p) return `<p>${esc(b.p)}</p>`;
    const [head, ...rows] = b.table;
    return `<div class="table-wrap"><table><thead><tr>${head.map((c) => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }).join('') + doc.footer.map((f) => `<p style="text-align:right;text-indent:0">${esc(f)}</p>`).join('');
}

function proposalText(doc) {
  return [doc.title, '', ...doc.blocks.map((b) => b.h ? '\n' + b.h : b.p ? '　　' + b.p : b.table.map((r) => r.join('｜')).join('\n')), '', ...doc.footer].join('\n');
}

/* 生成 .docx：文件结构按 Word / WPS 的要求写全（样式、设置、关系、文档属性），元素顺序符合规范 */
async function proposalDocx(doc) {
  if (!window.JSZip) throw new Error('nozip');
  const x = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const XML = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  const fonts = (f) => `<w:rFonts w:ascii="${f}" w:hAnsi="${f}" w:eastAsia="${f}" w:cs="${f}"/>`;
  const run = (t, { bold, size = 24, font = '宋体' } = {}) => `<w:r><w:rPr>${fonts(font)}${bold ? '<w:b/><w:bCs/>' : ''}<w:sz w:val="${size}"/><w:szCs w:val="${size}"/></w:rPr><w:t xml:space="preserve">${x(t)}</w:t></w:r>`;
  // pPr 子元素顺序：keepNext → spacing → ind → jc
  const para = (t, o = {}) => `<w:p><w:pPr>${o.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after || 0}" w:line="${o.line || 400}" w:lineRule="auto"/>${o.indent ? '<w:ind w:firstLine="480" w:firstLineChars="200"/>' : ''}${o.center ? '<w:jc w:val="center"/>' : o.right ? '<w:jc w:val="right"/>' : ''}</w:pPr>${t === '' ? '' : run(t, o)}</w:p>`;
  const border = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map((s) => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`).join('');
  const table = (rows) => {
    const cols = rows[0].length;
    // 列宽按内容长短分配，总宽 9000（A4 去掉页边距）
    const len = Array.from({ length: cols }, (_, c) => Math.min(30, Math.max(4, ...rows.map((r) => String(r[c] ?? '').length))));
    const total = len.reduce((a, b) => a + b, 0);
    const widths = len.map((l) => Math.round((l / total) * 9000));
    const grid = widths.map((w) => `<w:gridCol w:w="${w}"/>`).join('');
    const trs = rows.map((r, i) => `<w:tr>${i === 0 ? '<w:trPr><w:tblHeader/></w:trPr>' : ''}${r.map((c, k) => `<w:tc><w:tcPr><w:tcW w:w="${widths[k]}" w:type="dxa"/>${i === 0 ? '<w:shd w:val="clear" w:color="auto" w:fill="E7EFEA"/>' : ''}<w:vAlign w:val="center"/></w:tcPr>${para(String(c ?? ''), { bold: i === 0, size: 21, line: 300, center: i === 0 })}</w:tc>`).join('')}</w:tr>`).join('');
    return `<w:tbl><w:tblPr><w:tblW w:w="9000" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${border}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${trs}</w:tbl>${para('')}`;
  };
  const body = [para(doc.title, { center: true, bold: true, size: 36, font: '黑体', after: 240 })]
    .concat(doc.blocks.map((b) => (b.h ? para(b.h, { bold: true, size: 28, font: '黑体', before: 160, after: 80, keep: true }) : b.p ? para(b.p, { indent: true }) : table(b.table))))
    .concat(doc.footer.map((f, i) => para(f, { right: true, before: i ? 0 : 360 })))
    .join('');

  const files = {
    '[Content_Types].xml': `${XML}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`,
    '_rels/.rels': `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`,
    'word/_rels/document.xml.rels': `${XML}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/></Relationships>`,
    'word/styles.xml': `${XML}<w:styles ${W}><w:docDefaults><w:rPrDefault><w:rPr>${fonts('宋体')}<w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="en-US" w:eastAsia="zh-CN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="400" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`,
    'word/settings.xml': `${XML}<w:settings ${W}><w:defaultTabStop w:val="420"/><w:characterSpacingControl w:val="compressPunctuation"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>`,
    'word/document.xml': `${XML}<w:document ${W}><w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="851" w:footer="992" w:gutter="0"/></w:sectPr></w:body></w:document>`,
    'docProps/core.xml': `${XML}<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${x(doc.title)}</dc:title><dc:creator>活动策划工具箱</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().replace(/\.\d+Z$/, 'Z')}</dcterms:created></cp:coreProperties>`,
    'docProps/app.xml': `${XML}<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>活动策划工具箱</Application></Properties>`,
  };
  const zip = new JSZip();
  for (const [name, content] of Object.entries(files)) zip.file(name, content);
  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression: 'DEFLATE' });
}
